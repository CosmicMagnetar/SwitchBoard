# SwitchBoard + Switch local development stack
# Run: docker-compose up -d

version: "3.8"

services:
  # Switch Console server (local)
  switch-server:
    image: node:20-slim
    working_dir: /app
    command: >
      sh -c "apt-get update && apt-get install -y git docker.io && git clone https://github.com/sandbox-quantum/switch.git /app && cd /app && npm install && npm run dev"
    ports:
      - "8765:8765"
    volumes:
      - switch-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SWITCH_SERVER_URL=http://localhost:8765
      - NODE_ENV=development
    restart: unless-stopped
    networks:
      - switchboard

  # Mattermost (default chat app Switch connects to)
  mattermost:
    image: mattermost/mattermost-production:latest
    ports:
      - "8065:8065"
    volumes:
      - mattermost-data:/mattermost/data
    environment:
      - MM_SERVICESETTINGS_SITEURL=http://localhost:8065
      - MM_SERVICESETTINGS_LISTENADDRESS=:8065
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATAURCE=postgres://mmuser:mmpassword@db:5432/mattermost?sslmode=disable&connect_timeout=10
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - switchboard

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=mmuser
      - POSTGRES_PASSWORD=mmpassword
      - POSTGRES_DB=mattermost
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - switchboard

volumes:
  switch-data:
  mattermost-data:
  db-data:

networks:
  switchboard:
    driver: bridge
